async function api(path,o={}){
 const h={...(o.headers||{})};if(TOKEN&&o.auth!==false)h.Authorization='Bearer '+TOKEN;
 let body=o.body;if(body&&typeof body==='object'&&!(body instanceof Blob)){body=JSON.stringify(body);h['Content-Type']='application/json'}

async function submitOrder(id){
 const v=i=>$('#'+i).value.trim(),s=D.svc.find(x=>x.id==id);
 if(!v('f_n')||!v('f_c')||!v('f_d')||!v('f_g'))return toast('Заполните обязательные поля');
 if(!['c1','c2','c3'].every(i=>$('#'+i).checked))return toast('Подтвердите все три пункта (галочки не ставятся заранее)');
 if(SRV){if(SUBM)return;SUBM=true;try{const r=await api('/api/order',{method:'POST',auth:false,body:{action:'create',order:{svcId:s.id,adIds:[...document.querySelectorAll('.ad:checked')].map(c=>+c.value),name:v('f_n'),contact:v('f_c'),date:v('f_d'),time:v('f_t'),city:v('f_g'),com:v('f_m'),accepted:true,tg:TGDATA()}}});const o=r.order,L=myList();L.push({id:o.id,k:o.k});try{localStorage.setItem(MYK,JSON.stringify(L))}catch(e){}D.ord.unshift(o);
  modal(`<h2>Заявка №${o.id} принята</h2><p>Желаемая дата ${esc(o.date)} <span class="tag">не подтверждена</span> — её согласует фотограф.</p>${payBlock(o)}`);render()}catch(e){toast(e.message)}finally{SUBM=false}return}
 const ad=addons(id),o={id:D.seq++,name:v('f_n'),contact:v('f_c'),date:v('f_d'),time:v('f_t'),city:v('f_g'),com:v('f_m'),svc:s.name,cat:s.cat,ad,
 total:s.full+ad.reduce((a,b)=>a+b.price,0),first:s.first,paid:0,status:'Ожидает оплаты',pay:'Ожидает оплаты',note:'',log:[],
 acc:['contract','privacy','consent'].map(k=>({doc:DN[k],ver:D.docs[k].at(-1).v,at:now(),how:'чекбокс в приложении'}))};
 log(o,'Заявка создана; подтверждены документы (версии зафиксированы)');D.ord.unshift(o);save();
 modal(`<h2>Заявка №${o.id} принята</h2><p>Желаемая дата ${esc(o.date)} <span class="tag">не подтверждена</span> — её согласует фотограф.</p>${payBlock(o)}`);render();
}
function payBlock(o){return o.first==null?'<p class="mut">Размер первого платежа определит фотограф — мы сообщим.</p>':`<div class="warn"><b>ТЕСТОВЫЙ платёж.</b> Реальные деньги не списываются.</div><button class="btn" onclick="pay(${o.id})">Оплатить ${rub(o.first)} (тест)</button>`}
async function pay(id){if(SRV){if(window.PAYING)return;window.PAYING=1;const o=ord(id);if(!o){window.PAYING=0;return toast('Заявка не найдена')}try{const r=await api('/api/order',{method:'POST',auth:false,body:{action:'pay',id,k:o.k}});Object.assign(o,r.order);closeM();toast('Тестовый платёж выполнен');render()}catch(e){toast(e.message)}finally{window.PAYING=0}return}const o=ord(id);if(!o)return;o.paid=o.first;o.pay='Успешен (ТЕСТ)';o.status='Оплачен, ожидает консультации';log(o,'Тестовый платёж '+rub(o.first)+' — не реальные деньги');save();closeM();toast('Тестовый платёж выполнен');render()}
function my(){return `<h1>Мои заказы</h1>`+(D.ord.length?D.ord.map(o=>`<div class="card"><div class="row"><b>№${o.id} · ${esc(o.svc)}</b><span class="tag">${esc(o.status)}</span></div>
 <div class="mut">Желаемая дата: ${esc(o.date)} ${o.cdate?'':'<span class="tag">не подтверждена</span>'}${o.cdate?'· подтверждена: '+esc(o.cdate):''}<br>Итого: ${rub(o.total)} · оплата: ${esc(o.pay)}${o.paid?' (учтено '+rub(o.paid)+')':''}${o.alt?'<br>Фотограф предложил дату: '+esc(o.alt):''}</div>
 ${o.status=='Ожидает оплаты'&&o.first!=null?payBlock(o):''}</div>`).join(''):'<p class="mut">Заказов пока нет.</p>')}
function set(o,s,t){o.status=s;log(o,t||s);save();render()}
function act(id,a){
 const o=ord(id);if(!o)return;const v=($('#in'+id)||{}).value||'';
 const m={sch:()=>v?(o.cons=v,set(o,'Консультация назначена','Консультация назначена на '+v)):toast('Укажите дату консультации'),
 done:()=>v?(o.sum=v,log(o,'Консультация фактически проведена. Итог: '+v),set(o,'Ожидает решения фотографа')):toast('Укажите формат и краткий результат'),
 cont:()=>set(o,'Ожидает подтверждения даты','Фотограф продолжает сотрудничество'),
 alt:()=>v?(o.alt=v,log(o,'Предложена альтернативная дата '+v),save(),render()):toast('Укажите дату'),
 stop:()=>{D.ref.unshift({id:Date.now(),oid:o.id,by:'фотограф',reason:v||'—',st:RS[0],amt:'',note:''});o.pay='Возврат на рассмотрении';set(o,'Ожидает расчёта взаиморасчётов','Фотограф прекратил сотрудничество; создан запрос на расчёт')},
 rq:()=>{D.ref.unshift({id:Date.now(),oid:o.id,by:'клиент',reason:v||'—',st:RS[0],amt:'',note:''});o.pay='Возврат на рассмотрении';set(o,'Запрошено прекращение договора','Запрос на прекращение/возврат от клиента')},
 conf:()=>{o.cdate=v||o.date;set(o,'Дата подтверждена','Дата подтверждена вручную: '+o.cdate)},
 work:()=>set(o,'В работе'),fin:()=>{if(o.paid<o.total)o.pay='Не полностью оплачен (остаток вне MVP)';set(o,'Завершён')},
 first:()=>+v>0?(o.first=+v,log(o,'Задан первый платёж '+v),save(),render()):toast('Введите сумму'),
 note:()=>(o.note=v,log(o,'Заметка обновлена'),save(),render())};m[a]()
}
addEventListener('scroll',()=>$('#up').classList.toggle('on',scrollY>500),{passive:true});
function toTop(){try{$('#top').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}setTimeout(()=>{if(scrollY>0)scrollTo(0,0);const d=document.documentElement;if(d&&d.scrollTop>0)d.scrollTop=0;if(document.body.scrollTop>0)document.body.scrollTop=0},800)}
function setAt(k){const c=$('#app .chips'),x=c?c.scrollLeft:0;st.at=k;render();const n=$('#app .chips');if(n){n.scrollLeft=x;const o=n.querySelector('.on');if(o&&o.scrollIntoView)o.scrollIntoView({inline:'nearest',block:'nearest'})}}
function adm(){if(!st.adm)return loginScreen();
 const tabs=[['ord','Заказы'],['cat','Каталог'],['ref','Возвраты'],['doc','Документы'],['pho','Фото']];
 return `<h1>Админка</h1>`+`<div class="chips">`+tabs.map(t=>`<button class="chip ${st.at==t[0]?'on':''}" aria-pressed="${st.at==t[0]}" onclick="setAt('${t[0]}')">${t[1]}</button>`).join('')+`</div>`+admBody();
}
function admBody(){
 if(st.at=='pho')return phoHTML();
 if(st.at=='ord')return D.ord.length?D.ord.map(o=>{
  const B=(a,t,c='')=>`<button class="btn ${c}" onclick="act(${o.id},'${a}')">${t}</button>`,S=o.status;let b='';
  if(o.first==null&&S=='Ожидает оплаты')b+=B('first','Задать первый платёж');
  if(S=='Оплачен, ожидает консультации')b+=B('sch','Назначить консультацию');
  if(S=='Консультация назначена')b+=B('done','Консультация проведена');
  if(S=='Ожидает решения фотографа')b+=B('cont','Продолжить')+B('alt','Предложить др. дату','s')+B('stop','Прекратить','r');
  if(S=='Ожидает подтверждения даты')b+=B('conf','Подтвердить дату');
  if(S=='Дата подтверждена')b+=B('work','В работу');if(S=='В работе')b+=B('fin','Завершить');
  if(!['Завершён','Отменён','Запрошено прекращение договора','Ожидает расчёта взаиморасчётов'].includes(S))b+=B('rq','Запрос возврата от клиента','s');
  return `<div class="card"><div class="row"><b>№${o.id} · ${esc(o.svc)}</b><span class="tag">${S}</span></div>
  <div class="mut">${esc(o.name)} · ${esc(o.contact)} · ${esc(o.city)}<br>Желаемая дата: ${esc(o.date)} ${esc(o.time)} · итого ${rub(o.total)} · платёж: ${esc(o.pay)} ${String(o.pay||'').includes('ТЕСТ')?'<span class="tag t">тест</span>':''}
  ${(o.ad||[]).length?'<br>Доп.: '+(o.ad||[]).map(a=>esc(a.name)).join(', '):''}${o.com?'<br>Комм.: '+esc(o.com):''}${o.cons?'<br>Консультация: '+esc(o.cons):''}${o.sum?'<br>Итог консультации: '+esc(o.sum):''}${o.note?'<br>Заметка (скрыта от клиента): '+esc(o.note):''}</div>
  <input id="in${o.id}" placeholder="Поле для действия: дата / итог / сумма / причина / заметка">${b}${B('note','Сохранить как заметку','s')}
  <div class="log">Документы: ${(o.acc||[]).map(a=>esc(a.doc)+' р.'+a.ver).join('; ')}<br>${(o.log||[]).map(esc).join('<br>')}</div></div>`}).join(''):'<p class="mut">Заказов пока нет.</p>';
 if(st.at=='cat')return `<div class="warn">Изменения цен не затрагивают уже созданные заказы (в них сохранён снимок цены).</div>`+`<button class="btn" onclick="addSvc()">+ Новый тариф</button>`+D.svc.map(s=>`<div class="card"><label>Название<input value="${esc(s.name)}" onchange="svcSet(${s.id},'name',this.value)"></label><label>Категория<select onchange="svcSet(${s.id},'cat',this.value)">${Object.entries(CATS).map(([k,n])=>`<option value="${k}" ${k==s.cat?'selected':''}>${n}</option>`).join('')}</select></label><label>Описание<textarea rows="2" onchange="svcSet(${s.id},'desc',this.value)">${esc(s.desc)}</textarea></label><label>Срок готовности<input value="${esc(s.del)}" onchange="svcSet(${s.id},'del',this.value)"></label>
  <div class="row"><label>Полная цена<input type="number" value="${s.full}" onchange="svcSet(${s.id},'full',+this.value)"></label><label>Первый платёж<input type="number" value="${s.first??''}" placeholder="не задан" onchange="svcSet(${s.id},'first',this.value?+this.value:null)"></label></div>
  <label class="ck"><input type="checkbox" ${s.on?'checked':''} onchange="svcSet(${s.id},'on',this.checked)">Показывать клиентам</label><button class="btn s" onclick="askDel(${s.id})">Удалить тариф</button></div>`).join('')+
  '<h2>Дополнительные услуги</h2>'+D.add.map(a=>`<div class="card row"><span>${esc(a.name)} <span class="mut">(${a.cat=='wed'?'свадьбы':'индивидуальные'})</span></span>${a.price==null?'<span class="mut">+'+a.pct+'%</span>':`<input type="number" style="width:110px" value="${a.price}" onchange="addPrice(${a.id},this.value)">`}</div>`).join('');
 if(st.at=='ref')return `<div class="warn">Сумма расчёта не вычисляется автоматически: решение принимает администратор с учётом договора, фактически оказанных услуг, подтверждённых расходов и закона. Отметка «консультация проведена» сама по себе не основание для удержания.</div>`+(D.ref.length?D.ref.map((r,i)=>{const o=ord(r.oid);if(!o)return '';return `<div class="card"><b>Заказ №${r.oid}</b> · инициатор: ${esc(r.by)}<div class="mut">Оплачено: ${rub(o.paid)} (${esc(o.pay)}) · причина: ${esc(r.reason)}</div>
  <select onchange="D.ref[${i}].st=this.value;log(ord(${r.oid}),'Возврат: '+this.value);save()">${RS.map(s=>`<option ${s==r.st?'selected':''}>${s}</option>`).join('')}</select>
  <input type="number" placeholder="Утверждённая сумма, ₽" value="${esc(r.amt)}" onchange="D.ref[${i}].amt=this.value;save()"><input placeholder="Основание решения" value="${esc(r.note)}" onchange="D.ref[${i}].note=this.value;save()"></div>`}).join(''):'<p class="mut">Запросов нет.</p>');
 return Object.keys(DN).map(k=>{const d=D.docs[k].at(-1);return `<div class="card"><b>${DN[k]}</b><div class="mut">Текущая редакция: ${d.v} · ${d.f?esc(d.f.n)+' ('+Math.max(1,Math.round(d.f.s/1024))+' КБ)':'временный текст-заглушка'} · ${esc(d.d)} · всего версий: ${D.docs[k].length}. Принятые заказами версии остаются неизменными.</div><div class="row" style="margin:10px 0"><button class="btn s" onclick="showDoc('${k}')">Посмотреть</button></div><label>Загрузить новую редакцию (PDF, DOC, DOCX, до ${SRV?4:10} МБ)<input type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,application/pdf" onchange="docUp('${k}',this)"></label></div>`}).join('');
}
function svcSet(id,k,v){const s=D.svc.find(x=>x.id==id);if(!s)return;if(k=='full'){v=+v;if(!isFinite(v)||v<0)return toast('Введите корректную цену')}if(k=='first'&&v!==''){v=v==null?null:+v;if(v!=null&&(!isFinite(v)||v<0))return toast('Введите корректную сумму')}s[k]=v;save()}
function addPrice(id,v){const a=D.add.find(x=>x.id==id);if(!a)return;const n=v===''||v==null?null:+v;if(n!=null&&(!isFinite(n)||n<0))return toast('Введите корректную сумму');a.price=n;if(n==null&&!a.pct)a.pct=10;save();render()}
function addSvc(){D.svc.unshift({id:Math.max(0,...D.svc.map(s=>s.id))+1,cat:'ind',name:'Новый тариф',desc:'',del:'—',full:0,first:null,on:false});save();render();toast('Тариф создан и пока скрыт от клиентов')}
function askDel(id){const s=D.svc.find(x=>x.id==id);if(!s)return;modal(`<h2>Удалить тариф?</h2><p>«${esc(s.name)}» исчезнет из каталога. Уже созданные заказы не изменятся.</p><button class="btn r" onclick="delSvc(${id})">Удалить</button>`)}
function delSvc(id){D.svc=D.svc.filter(s=>s.id!=id);save();closeM();render();toast('Тариф удалён')}
render();
initServer().then(()=>{if(!SRV)return idbOpen().then(idbAll).then(()=>{if(PH.s.length||PH.a.length||PH.f.length)render()})});
(function(){const T=window.Telegram&&Telegram.WebApp;if(!T)return;
 try{T.ready();T.expand();T.setHeaderColor('#ffffff');T.setBackgroundColor('#ffffff');if(T.disableVerticalSwipes)T.disableVerticalSwipes()}catch(e){}
 const top=()=>$('#vw').style.display=='block'?'vw':$('#modal2').style.display=='flex'?'m2':$('#modal').style.display=='flex'?'m':null;
 const sync=()=>{try{top()?T.BackButton.show():T.BackButton.hide()}catch(e){}};
 try{T.BackButton.onClick(()=>{const t=top();if(t=='vw')vwClose();else if(t=='m2')closeM('modal2');else if(t=='m')closeM();sync()})}catch(e){}
 try{new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']})}catch(e){}
})();
</script></body></html>
