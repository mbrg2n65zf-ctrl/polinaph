 const parts=String(t).split(/\r\n?|\n/);try{for(let i=0;i<parts.length;i++){if(i&&!document.execCommand('insertLineBreak'))document.execCommand('insertHTML',false,'<br>');if(parts[i])document.execCommand('insertText',false,parts[i])}}catch(e2){document.execCommand('insertText',false,t)}}
function evSaveDesc(id){const el=$('#rt'+id),e=D.ev.find(x=>x.id==id);if(!el||!e)return;
 const v=el.innerHTML.slice(0,6000);if(v===e.d)return;e.d=v;save();toast('Описание сохранено')}
function evSet(id,k,v){const e=D.ev.find(x=>x.id==id);if(!e)return;
 if(k=='city'){if(v!='msk'&&v!='gel')return toast('Недопустимый город');e.city=v}
 else if(k=='price'){v=+v;if(!isFinite(v)||v<0)return toast('Введите корректную цену');e.price=v}
 else if(k=='old'||k=='pre'){if(v===''||v==null)e[k]=null;else{v=+v;if(!isFinite(v)||v<0)return toast('Введите корректную сумму');e[k]=v}}
 else if(k=='t')e.t=String(v??'').slice(0,120);
 else if(k=='on')e.on=!!v;
 save();render()}
const ruDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?m[3]+'.'+m[2]+'.'+m[1]:''};
function evAddDate(id){const e=D.ev.find(x=>x.id==id),i=$('#dt'+id);if(!e||!i)return;const d=ruDate(i.value);if(!d)return toast('Выберите дату в поле выше');if(e.dates.includes(d))return toast('Такая дата уже добавлена');e.dates.push(d);save();render()}
function evDelDate(id,i){const e=D.ev.find(x=>x.id==id);if(!e||!(i>=0&&i<e.dates.length))return;e.dates.splice(i,1);save();render()}
// Фото анонса: загружается сразу при выборе файла (та же папка photos/ и счётчик
// PH.q, что у фотографий стенки), id запоминается в анонсе и уходит на сервер
// вместе с остальными данными при автосохранении.
async function evUpImg(id,inp){
 const e=D.ev.find(x=>x.id==id);if(!e)return;
 const f=inp.files&&inp.files[0];if(!f)return;
 if(!f.type.startsWith('image/'))return toast('Нужен файл изображения (JPEG, PNG, WebP)');
 toast('Загружаю фото…');
 try{const nid='p'+PH.q++,u=await storeImg(nid,f);IMG[nid]=u;e.img=nid;save();render();toast(SRV?'Фото загружено, сохраняю…':'Фото добавлено (макет)')}
 catch(err){toast('Не удалось загрузить: '+((err&&err.message)||'файл не подошёл'))}
}
function evDelImg(id){const e=D.ev.find(x=>x.id==id);if(!e||!e.img)return;e.img='';save();render();toast('Фото убрано из анонса')}
function askDelEv(id){const e=D.ev.find(x=>x.id==id);if(!e)return;modal(`<h2>Удалить анонс?</h2><p>«${esc(e.t)}» исчезнет с сайта. Уже созданные записи не изменятся.</p><button class="btn r" onclick="delEv(${id})">Удалить</button>`)}
function delEv(id){D.ev=D.ev.filter(e=>e.id!=id);save();closeM();render();toast('Анонс удалён')}
render();
initServer().then(()=>{if(!SRV)return idbOpen().then(idbAll).then(()=>{if(PH.s.length||Object.keys(VID).length||D.ev.some(e=>e&&e.img))render()})});
(function(){const T=window.Telegram&&Telegram.WebApp;if(!T)return;
 try{T.ready();T.expand();T.setHeaderColor('#ffffff');T.setBackgroundColor('#ffffff');if(T.disableVerticalSwipes)T.disableVerticalSwipes()}catch(e){}
 const top=()=>$('#vw').style.display=='block'?'vw':$('#modal2').style.display=='flex'?'m2':$('#modal').style.display=='flex'?'m':null;
 const sync=()=>{try{top()?T.BackButton.show():T.BackButton.hide()}catch(e){}};
 try{T.BackButton.onClick(()=>{const t=top();if(t=='vw')vwClose();else if(t=='m2')closeM('modal2');else if(t=='m')closeM();sync()})}catch(e){}
 try{new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']})}catch(e){}
})();
