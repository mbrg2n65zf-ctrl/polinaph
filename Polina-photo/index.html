const pollPay=(id,k,n)=>{const tick=async m=>{if(m<=0)return;const cur=ord(id);if(!cur)return;try{const r=await api('/api/order?id='+id,{auth:false,headers:{'X-Order-Key':k}});if(r.order&&(r.order.status!=cur.status||(r.order.paid||0)!=(cur.paid||0))){Object.assign(cur,r.order);render();return}}catch(e){}setTimeout(()=>tick(m-1),5000)};setTimeout(()=>tick(n||24),5000)};
async function pay(id){

  toast((r&&r.error)||'Не удалось начать оплату — попробуйте ещё раз')}

const dmy=s=>{const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s||''));return m?m[3]+'-'+m[2]+'-'+m[1]:''};
function ofOrd(){
 const O=st.of,q=O.q.trim().toLowerCase();
 const l=D.ord.filter(o=>{if(!o)return false;
  if(O.stt&&o.status!=O.stt)return false;
  if(O.city&&o.cat!=O.city)return false;
  if(q&&![o.id,o.name,o.contact,o.svc].join(' ').toLowerCase().includes(q))return false;
  const d=dmy(o.date);
  if(O.d1&&(!d||d<O.d1))return false;
  if(O.d2&&(!d||d>O.d2))return false;
  return true});
 l.sort((a,b)=>{let x,y;
  if(O.sk=='id'||O.sk=='total'||O.sk=='paid'){x=+a[O.sk]||0;y=+b[O.sk]||0}
  else if(O.sk=='date'){x=dmy(a.date);y=dmy(b.date)}
  else{x=String(a[O.sk]??'').toLowerCase();y=String(b[O.sk]??'').toLowerCase()}
  return (x<y?-1:x>y?1:0)*O.sd});

function ofEdit(id,k,v){

// Финансовый отчёт: CSV с разделителем «;» и BOM — открывается в Excel двойным
// кликом. В конце файла — итоговый блок: записи, клиенты, заработано, план, остаток.
function ofCsv(l){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const created=o=>{const s=(o.log&&o.log[o.log.length-1])||'';const m=/^(\d{2}\.\d{2}\.\d{4}),/.exec(s);return m?m[1]:''};
 const lines=[['№','Создана','Клиент','Контакт','Город','Услуга','Дата фото дня','Дата подтверждена','Статус','Итого, ₽','Первый платёж, ₽','Оплачено, ₽','Оплата','Комментарий','Заметка фотографа'].map(q).join(';')];
 for(const o of l)lines.push([o.id,created(o),o.name,o.contact,o.city,o.svc,o.date,o.cdate||'',o.status,+o.total||0,o.first==null?'':o.first,+o.paid||0,o.pay,o.com||'',o.note||''].map(q).join(';'));
 const cc={};let paidS=0,totS=0;for(const o of l){cc[(o.contact||o.name||'').trim().toLowerCase()]=1;paidS+=+o.paid||0;totS+=+o.total||0}
 const O=st.of,fl=[[O.q,'поиск: «'+O.q+'»'],[O.stt,'статус: '+O.stt],[O.city,'город: '+(CITIES[O.city]||O.city)],[O.d1,'дата с '+ruDate(O.d1)],[O.d2,'дата по '+ruDate(O.d2)]].filter(x=>x[0]).map(x=>x[1]).join(', ');
 lines.push('');
 lines.push(['Записей в отчёте',l.length].map(q).join(';'));
 lines.push(['Клиентов (уникальных контактов)',Object.keys(cc).length].map(q).join(';'));
 lines.push(['Заработано (оплачено клиентами), ₽',paidS].map(q).join(';'));
 lines.push(['Сумма всех записей (план), ₽',totS].map(q).join(';'));
 lines.push(['Ожидается оплаты, ₽',Math.max(0,totS-paidS)].map(q).join(';'));
 lines.push(['Отчёт сформирован',now()+(fl?' · фильтры: '+fl:' · все записи')].map(q).join(';'));
 return lines.join('\r\n')}

// Нормализация введённой ссылки: @username и «голый» ник превращаются в полный
// https-адрес нужной сети, номер телефона — в wa.me. Не похоже на адрес — пусто.
function socNorm(k,v){let s=String(v??'').trim().slice(0,200);if(!s)return '';
 s=s.replace(/^@/,'').replace(/^http:\/\//i,'https://');
 if(!/^https:\/\//i.test(s)){
  const dom=/^[a-z0-9.-]+\.[a-z]{2,}([/?#]|$)/i.test(s);
  if(dom)s='https://'+s;
  else if(k=='tg')s='https://t.me/'+s;
  else if(k=='ig')s='https://instagram.com/'+s;
  else if(k=='vk')s='https://vk.com/'+s;
  else if(k=='wa'){const d=s.replace(/\D/g,'');if(!d)return '';s='https://wa.me/'+(d.length==11&&d[0]=='8'?'7'+d.slice(1):d)}
  else return ''}
 return s}
// Финальная проверка: https, хост — домен именно этой сети, путь — только ASCII
// (ники соцсетей латиницей; кириллицы в ссылке профиля не бывает).
const SOC_OK=(k,s)=>{const m=typeof s=='string'?s.match(/^https:\/\/([A-Za-z0-9.-]+)(:\d{2,5})?(\/[!-~]*)?$/):null;
 if(!m||s.length>200)return false;
 const host=m[1].toLowerCase().replace(/^www\./,'');
 if(!((SOC_META[k]?SOC_META[k].h:[]).includes(host)))return false;
 if(k=='wa'&&host=='wa.me'&&!/^\/\d{6,15}(\?[!-~]*)?$/.test(m[3]||''))return false;
 return true};
function phSoc(k,v){const raw=String(v??'').trim();PH.soc=PH.soc&&typeof PH.soc=='object'&&!Array.isArray(PH.soc)?PH.soc:{};
 if(!raw){delete PH.soc[k];phSave();render();toast('Кнопка «'+SOC_META[k].n+'» скрыта');return}
 const s=socNorm(k,raw);
 if(!s||!SOC_OK(k,s)){toast('Не похоже на ссылку «'+SOC_META[k].n+'» — пример: '+SOC_META[k].ex);render();return}
 PH.soc[k]=s;phSave();render();toast('Ссылка «'+SOC_META[k].n+'» сохранена')}

  <label style="margin-top:8px">Описание — панель сверху форматирует выделенный текст, Enter делает новую строку</label>
  <div class="rtb" role="toolbar" aria-label="Форматирование описания">
   <button type="button" class="tbn" title="Жирный" onmousedown="return rtm(event)" onclick="rtCmd('bold')"><b>Ж</b></button>
   <button type="button" class="tbn" title="Курсив" onmousedown="return rtm(event)" onclick="rtCmd('italic')"><i>К</i></button>
   <button type="button" class="tbn" title="Подчёркнутый" onmousedown="return rtm(event)" onclick="rtCmd('underline')"><u>Ч</u></button>
   <button type="button" class="tbn" title="Зачёркнутый" onmousedown="return rtm(event)" onclick="rtCmd('strikeThrough')"><s>З</s></button>
   <button type="button" class="tbn" title="Маркированный список" onmousedown="return rtm(event)" onclick="rtCmd('insertUnorderedList')">• Список</button>
   <button type="button" class="tbn" title="Нумерованный список" onmousedown="return rtm(event)" onclick="rtCmd('insertOrderedList')">1. Список</button>
   <button type="button" class="tbn" title="Вставить ссылку" onmousedown="return rtm(event)" onclick="rtLink()">Ссылка</button>
   <button type="button" class="tbn" title="Убрать ссылку" onmousedown="return rtm(event)" onclick="rtCmd('unlink')">Без ссылки</button>
   <button type="button" class="tbn" title="Убрать форматирование выделенного" onmousedown="return rtm(event)" onclick="rtCmd('removeFormat')">⌫ Формат</button>
  </div>
  <div class="rt" id="rt${e.id}" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Описание анонса" onblur="evSaveDesc(${e.id})" onpaste="rtPaste(event)">${rtOut(e.d)}</div>
  <div class="mut" style="font-size:12px;margin:0 0 6px">Описание сохраняется само, когда вы уходите из поля. Вставка из Word и мессенджеров превращается в чистый текст с переносами.</div>
  <label style="margin-top:8px">Фотографии анонса — встанут слайдами между названием и описанием (можно выбрать несколько сразу)<input type="file" accept="image/*" multiple onchange="evUpPhotos(${e.id},this)"></label>
  ${(e.photos&&e.photos.length)?`<div style="${GR}">${e.photos.map((pid,i)=>`<div style="position:relative">${IM(pid)}<button class="btn r" style="${SB};top:3px;right:3px" aria-label="Убрать фото ${i+1}" onclick="evDelPhoto(${e.id},${i})">✕</button></div>`).join('')}</div>`:'<p class="mut" style="margin:2px 0 0">Фото пока нет — карточка анонса будет без слайдов.</p>'}
  <div class="row"><label>Цена, ₽<input type="number" value="${e.price}" onchange="evSet(${e.id},'price',this.value)"></label><label>Цена до скидки, ₽<input type="number" value="${e.old??''}" placeholder="без скидки" onchange="evSet(${e.id},'old',this.value===''?'':this.value)"></label></div>
  <label>Предоплата сейчас, ₽<input type="number" value="${e.pre??''}" placeholder="полная цена при записи" onchange="evSet(${e.id},'pre',this.value===''?'':this.value)"></label>
  <div class="mut" style="margin:6px 0 0">Даты фото дня (${e.dates.length}) — клиент записывается только на них:</div>
  ${e.dates.length?`<div class="dates" style="margin:6px 0 0">${e.dates.map((d,i)=>`<span>${esc(d)} <b style="cursor:pointer" role="button" aria-label="Убрать дату" onclick="evDelDate(${e.id},${i})">✕</b></span>`).join('')}</div>`:'<p class="mut" style="margin:4px 0 0">Дат пока нет — добавьте хотя бы одну.</p>'}
  <div class="row" style="margin-top:8px;align-items:flex-end"><label style="flex:1">Добавить дату<input type="date" id="dt${e.id}"></label><button class="btn s" onclick="evAddDate(${e.id})">+ дата</button></div>
  <label class="ck"><input type="checkbox" ${e.on?'checked':''} onchange="evSet(${e.id},'on',this.checked)">Показывать клиентам</label>
 <button class="btn s" onclick="askDelEv(${e.id})">Удалить анонс</button></div>`).join(''):'<p class="mut">Анонсов нет — создайте первый.</p>');
 if(st.at=='ref')return `<div class="warn">Сумма расчёта не вычисляется автоматически: решение принимает администратор с учётом договора, фактически оказанных услуг, подтверждённых расходов и закона. Отметка «консультация проведена» сама по себе не основание для удержания.</div>`+(D.ref.length?D.ref.map((r,i)=>{const o=ord(r.oid);if(!o)return '';return `<div class="card"><b>Запись №${r.oid}</b> · инициатор: ${esc(r.by)}<div class="mut">Оплачено: ${rub(o.paid)} (${esc(o.pay)}) · причина: ${esc(r.reason)}</div>
  <select onchange="D.ref[${i}].st=this.value;log(ord(${r.oid}),'Возврат: '+this.value);save()">${RS.map(s=>`<option ${s==r.st?'selected':''}>${s}</option>`).join('')}</select>
  <input type="number" placeholder="Утверждённая сумма, ₽" value="${esc(r.amt)}" onchange="D.ref[${i}].amt=this.value;save()"><input placeholder="Основание решения" value="${esc(r.note)}" onchange="D.ref[${i}].note=this.value;save()"></div>`}).join(''):'<p class="mut">Запросов нет.</p>');
 return Object.keys(DN).map(k=>{const d=D.docs[k].at(-1);return `<div class="card"><b>${DN[k]}</b><div class="mut">Текущая редакция: ${d.v} · ${d.f?esc(d.f.n)+' ('+Math.max(1,Math.round(d.f.s/1024))+' КБ)':'временный текст-заглушка'} · ${esc(d.d)} · всего версий: ${D.docs[k].length}. Принятые записями версии остаются неизменными.</div><div class="row" style="margin:10px 0"><button class="btn s" onclick="showDoc('${k}')">Посмотреть</button></div><label>Загрузить новую редакцию (PDF, DOC, DOCX, до ${SRV?4:10} МБ)<input type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,application/pdf" onchange="docUp('${k}',this)"></label></div>`}).join('');
}
// ——— редактор анонсов ————————————————————————————————————————————————————————
function newEv(){D.ev.unshift({id:Math.max(0,...D.ev.map(e=>e.id))+1,city:st.city,t:'Новый фото день',d:'',photos:[],dates:[],price:0,old:null,pre:null,on:false});save();render();toast('Анонс создан и пока скрыт от клиентов')}
// ——— визуальный редактор описания ————————————————————————————————————————————
// Кнопки панели не забирают фокус (mousedown гасится), поэтому команда применяется
// к выделению внутри поля. Описание — ограниченный HTML: сервер дополнительно
// чистит его (richText в api/_lib.js), так что клиентам уходит только разметка.
function setDef(v){D.set.def=CITIES[v]?v:'';save();render();toast(D.set.def?'Первая страница сайта: '+CITIES[D.set.def]:'Город по умолчанию не задан — открывается Москва')}
const rtm=e=>{e.preventDefault();return false};
function rtCmd(c,v){try{document.execCommand(c,false,v||null)}catch(e){}}
function rtLink(){const u=prompt('Адрес ссылки (https://…, mailto:… или tel:…)','https://');if(u==null)return;const s=u.trim();
 if(/^(https?:\/\/|mailto:|tel:)/i.test(s))rtCmd('createLink',s);else toast('Ссылка должна начинаться с https://, http://, mailto: или tel:')}
function rtPaste(e){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');if(!t)return;
 const parts=String(t).split(/\r\n?|\n/);try{for(let i=0;i<parts.length;i++){if(i&&!document.execCommand('insertLineBreak'))document.execCommand('insertHTML',false,'<br>');if(parts[i])document.execCommand('insertText',false,parts[i])}}catch(e2){document.execCommand('insertText',false,t)}}
function evSaveDesc(id){const el=$('#rt'+id),e=D.ev.find(x=>x.id==id);if(!el||!e)return;
 const v=el.innerHTML.slice(0,6000);if(v===e.d)return;e.d=v;save();toast('Описание сохранено')}
function evSet(id,k,v){const e=D.ev.find(x=>x.id==id);if(!e)return;
 if(k=='city'){if(v!='msk'&&v!='gel')return toast('Недопустимый город');e.city=v}
 else if(k=='price'){v=+v;if(!isFinite(v)||v<0)return toast('Введите корректную цену');e.price=v}
 else if(k=='old'||k=='pre'){if(v===''||v==null)e[k]=null;else{v=+v;if(!isFinite(v)||v<0)return toast('Введите корректную сумму');e[k]=v}}
 else if(k=='t')e.t=String(v??'').slice(0,120);
 else if(k=='on')e.on=!!v;
 save();render()}
const ruDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?m[3]+'.'+m[2]+'.'+m[1]:''};
function evAddDate(id){const e=D.ev.find(x=>x.id==id),i=$('#dt'+id);if(!e||!i)return;const d=ruDate(i.value);if(!d)return toast('Выберите дату в поле выше');if(e.dates.includes(d))return toast('Такая дата уже добавлена');if(isPastDate(d))return toast('Дата уже прошла — прошедшие фото дни показываются клиентам только в архиве');e.dates.push(d);save();render()}
function evDelDate(id,i){const e=D.ev.find(x=>x.id==id);if(!e||!(i>=0&&i<e.dates.length))return;e.dates.splice(i,1);save();render()}
// Фото анонса: загружаются сразу при выборе файлов (та же папка photos/ и счётчик
// PH.q, что у главного фото первого экрана), id запоминаются в анонсе и уходят
// на сервер вместе с остальными данными при автосохранении. На сайте они
// показываются слайдами между названием и описанием; максимум 12 фото на анонс.
async function evUpPhotos(id,inp){
 const e=D.ev.find(x=>x.id==id);if(!e)return;
 const files=[...(inp.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return toast('Нужны файлы изображений (JPEG, PNG, WebP)');
 if(!Array.isArray(e.photos))e.photos=e.img?[e.img]:[];
 toast('Загружаю фото…');let n=0;
 for(const f of files){
  if(e.photos.length>=12){toast('В анонсе максимум 12 фото');break}
  try{const nid='p'+PH.q++,u=await storeImg(nid,f);IMG[nid]=u;e.photos.push(nid);n++;toast('Загружено '+n+' из '+files.length)}catch(err){PERR=(err&&err.message)||''}}
 if(n){delete e.img;save();render()}
 toast(n?(SRV?'Фото загружены, сохраняю…':'Фото добавлены: '+n):'Не удалось загрузить: '+(PERR||'файл не подошёл'))}
function evDelPhoto(id,i){const e=D.ev.find(x=>x.id==id);if(!e||!Array.isArray(e.photos)||!(i>=0&&i<e.photos.length))return;e.photos.splice(i,1);save();render();toast('Фото убрано из анонса')}
function askDelEv(id){const e=D.ev.find(x=>x.id==id);if(!e)return;modal(`<h2>Удалить анонс?</h2><p>«${esc(e.t)}» исчезнет с сайта. Уже созданные записи не изменятся.</p><button class="btn r" onclick="delEv(${id})">Удалить</button>`)}
function delEv(id){D.ev=D.ev.filter(e=>e.id!=id);save();closeM();render();toast('Анонс удалён')}
render();
initServer().then(()=>{if(!SRV)return idbOpen().then(idbAll).then(()=>{if(PH.s.length||Object.keys(VID).length||D.ev.some(e=>e&&((e.photos&&e.photos.length)||e.img)))render()})});
(function(){const T=window.Telegram&&Telegram.WebApp;if(!T)return;
 try{T.ready();T.expand();T.setHeaderColor('#ffffff');T.setBackgroundColor('#ffffff');if(T.disableVerticalSwipes)T.disableVerticalSwipes()}catch(e){}
 const top=()=>$('#vw').style.display=='flex'?'vw':$('#modal2').style.display=='flex'?'m2':$('#modal').style.display=='flex'?'m':null;
 const sync=()=>{try{top()?T.BackButton.show():T.BackButton.hide()}catch(e){}};
 try{T.BackButton.onClick(()=>{const t=top();if(t=='vw')vwClose();else if(t=='m2')closeM('modal2');else if(t=='m')closeM();sync()})}catch(e){}
 try{new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']})}catch(e){}
})();
</script></body></html>
